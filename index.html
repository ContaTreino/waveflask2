<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#0d0d0f"/>
<title>WAVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:      #0d0d0f;
  --surf:    #141417;
  --card:    #1c1c22;
  --border:  #2a2a35;
  --accent:  #a259ff;
  --accent2: #c084fc;
  --text:    #f0f0f8;
  --muted:   #6b6b80;
  --safe-b:  env(safe-area-inset-bottom, 0px);
  --topbar-h: 0px; /* set by JS */
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; }
body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100dvh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ══ TOP BAR ════════════════════════════════════ */
#topbar {
  flex-shrink: 0;
  background: var(--surf);
  border-bottom: 1px solid var(--border);
  padding: 14px 16px 10px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.logo {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 22px; font-weight: 700;
  color: var(--accent2);
  letter-spacing: -0.5px;
}
.logo em { color: var(--text); font-style: normal; }

.search-row { display: flex; gap: 8px; }
.search-row input {
  flex: 1; min-width: 0;
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  padding: 10px 14px;
  font-size: 14px; color: var(--text);
  font-family: inherit; outline: none;
  -webkit-appearance: none;
  transition: border-color .2s;
}
.search-row input:focus { border-color: var(--accent); }
.search-row input::placeholder { color: var(--muted); }
.search-row button {
  flex-shrink: 0;
  background: var(--accent);
  border: none; border-radius: 12px;
  padding: 10px 18px;
  color: #fff; font-size: 14px; font-weight: 600;
  font-family: inherit; cursor: pointer;
}

.tabs {
  display: flex; gap: 8px;
  overflow-x: auto; -webkit-overflow-scrolling: touch;
  scrollbar-width: none; padding-bottom: 2px;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex-shrink: 0;
  padding: 7px 18px;
  border-radius: 20px;
  border: 1.5px solid var(--border);
  background: transparent;
  color: var(--muted); font-size: 13px; font-weight: 500;
  font-family: inherit; cursor: pointer;
  transition: all .15s;
}
.tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }

/* ══ SCROLL AREA ════════════════════════════════ */
#main {
  flex: 1;
  overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding: 16px 14px 160px;
}

.section-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 18px; font-weight: 700;
  margin-bottom: 14px;
}

/* ── Track list ─────────────────────── */
.track-list { display: flex; flex-direction: column; gap: 1px; }

.track-item {
  display: grid;
  grid-template-columns: 52px 1fr 32px;
  align-items: center;
  gap: 12px;
  padding: 7px 8px;
  border-radius: 10px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background .12s;
}
.track-item:active, .track-item:hover { background: var(--card); }
.track-item.playing { background: rgba(162,89,255,.13); }

.track-cover {
  width: 52px; height: 52px;
  border-radius: 8px;
  object-fit: cover;
  background: var(--border);
  display: block; flex-shrink: 0;
}
.track-info { overflow: hidden; }
.track-title {
  font-size: 14px; font-weight: 500;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.track-item.playing .track-title { color: var(--accent2); }
.track-artist {
  font-size: 12px; color: var(--muted); margin-top: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.track-dur { font-size: 11px; color: var(--muted); text-align: right; }

/* ── Card grid ──────────────────────── */
.card-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}
@media (min-width: 480px) { .card-grid { grid-template-columns: repeat(3, 1fr); } }

.card {
  background: var(--card);
  border-radius: 12px; overflow: hidden;
  cursor: pointer; border: 1px solid var(--border);
  -webkit-tap-highlight-color: transparent;
  transition: transform .15s;
}
.card:active { transform: scale(0.96); }
.card-cover { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: var(--border); }
.card-body { padding: 9px 10px 11px; }
.card-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

/* ── States ─────────────────────────── */
.empty { text-align: center; color: var(--muted); padding: 60px 20px; font-size: 14px; }
.spinner {
  width: 30px; height: 30px;
  border: 3px solid var(--border); border-top-color: var(--accent);
  border-radius: 50%; animation: spin .7s linear infinite;
  margin: 60px auto;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ══ MINI PLAYER (sempre visível, toca ao clicar expande) ══ */
#mini-player {
  position: fixed;
  bottom: calc(var(--safe-b) + 64px);
  left: 8px; right: 8px;
  background: #1e1a2e;
  border: 1px solid rgba(162,89,255,.3);
  border-radius: 16px;
  padding: 10px 14px;
  display: none;
  align-items: center;
  gap: 12px;
  z-index: 60;
  cursor: pointer;
  box-shadow: 0 8px 32px rgba(0,0,0,.6);
  -webkit-tap-highlight-color: transparent;
}
#mini-player.visible { display: flex; }

#mini-cover {
  width: 42px; height: 42px;
  border-radius: 8px; object-fit: cover;
  background: var(--border); flex-shrink: 0;
}
.mini-text { flex: 1; overflow: hidden; }
#mini-title {
  font-size: 13px; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  color: var(--text);
}
#mini-artist { font-size: 11px; color: var(--muted); margin-top: 1px; }

.mini-btns { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
.mini-btn {
  background: none; border: none;
  color: var(--muted); cursor: pointer;
  padding: 7px; border-radius: 50%;
  display: flex; align-items: center;
  -webkit-tap-highlight-color: transparent;
}
.mini-btn:active { color: var(--text); }
.mini-play-btn {
  width: 38px; height: 38px;
  background: var(--accent); color: #fff;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
}
.mini-play-btn:active { background: var(--accent2); }

/* progress line under mini player */
.mini-prog {
  position: absolute;
  bottom: 0; left: 14px; right: 14px; height: 2px;
  background: var(--border); border-radius: 1px; overflow: hidden;
}
.mini-prog-fill { height: 100%; background: var(--accent2); border-radius: 1px; width: 0%; }

/* ══ BOTTOM NAV ═════════════════════════════════ */
#bottom-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: calc(56px + var(--safe-b));
  background: var(--surf);
  border-top: 1px solid var(--border);
  display: flex; align-items: flex-start;
  padding-top: 8px;
  z-index: 70;
}
.nav-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  gap: 3px; background: none; border: none; cursor: pointer;
  color: var(--muted); font-size: 10px; font-family: inherit;
  -webkit-tap-highlight-color: transparent;
  padding: 0;
}
.nav-btn svg { display: block; }
.nav-btn.active { color: var(--accent2); }
.nav-btn span { font-size: 10px; font-weight: 500; }

/* ══ FULL PLAYER SHEET ══════════════════════════ */
#player-sheet {
  position: fixed; inset: 0;
  z-index: 200;
  display: flex; flex-direction: column;
  transform: translateY(100%);
  transition: transform .35s cubic-bezier(.4,0,.2,1);
  background: var(--bg);
}
#player-sheet.open { transform: translateY(0); }

.ps-header {
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px 8px;
}
.ps-label { font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); text-align: center; flex: 1; }
.ps-close, .ps-more {
  background: none; border: none; color: var(--muted);
  cursor: pointer; padding: 6px; border-radius: 8px;
  display: flex; align-items: center;
  -webkit-tap-highlight-color: transparent;
}
.ps-close:active, .ps-more:active { background: var(--card); color: var(--text); }

.ps-cover-wrap {
  flex: 1; display: flex; align-items: center; justify-content: center;
  padding: 0 32px;
  min-height: 0;
}
#ps-cover {
  width: 100%; max-width: 320px; aspect-ratio: 1;
  object-fit: cover;
  border-radius: 20px;
  background: var(--card);
  box-shadow: 0 24px 60px rgba(0,0,0,.7);
  display: block;
}

.ps-info {
  flex-shrink: 0;
  padding: 20px 28px 0;
  display: flex; align-items: center; gap: 16px;
}
.ps-text { flex: 1; overflow: hidden; }
#ps-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 22px; font-weight: 700;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#ps-artist { font-size: 14px; color: var(--muted); margin-top: 4px; }

/* progress */
.ps-progress {
  flex-shrink: 0;
  padding: 18px 28px 4px;
}
.ps-bar-wrap {
  position: relative; height: 4px;
  background: var(--border); border-radius: 2px;
}
#ps-fill { height: 100%; background: var(--accent2); border-radius: 2px; width: 0%; pointer-events: none; }
#ps-seek {
  position: absolute; inset: -10px 0;
  opacity: 0; width: 100%; height: 24px;
  -webkit-appearance: none; cursor: pointer;
}
.ps-times { display: flex; justify-content: space-between; margin-top: 6px; }
.ps-times span { font-size: 11px; color: var(--muted); }

/* controls */
.ps-controls {
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 4px 28px 8px;
}
.pc-btn {
  background: none; border: none; color: var(--muted);
  cursor: pointer; padding: 10px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
  transition: color .15s;
}
.pc-btn:active { color: var(--text); }
.pc-btn.active { color: var(--accent2); }
.pc-play {
  width: 64px; height: 64px;
  background: var(--accent); color: #fff;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  border: none; cursor: pointer;
  box-shadow: 0 8px 24px rgba(162,89,255,.4);
  -webkit-tap-highlight-color: transparent;
  flex-shrink: 0;
}
.pc-play:active { transform: scale(0.95); }

/* queue inside player */
.ps-queue-row {
  flex-shrink: 0;
  display: flex; justify-content: space-around; align-items: center;
  padding: 2px 28px calc(var(--safe-b) + 20px);
}
.pq-btn {
  background: none; border: none; color: var(--muted);
  cursor: pointer; font-family: inherit; font-size: 11px; font-weight: 600;
  letter-spacing: .5px; text-transform: uppercase;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 8px 16px; border-radius: 10px;
  -webkit-tap-highlight-color: transparent;
}
.pq-btn:active { background: var(--card); color: var(--text); }
.pq-btn svg { color: var(--muted); }
.pq-btn.active svg { color: var(--accent2); }

/* ══ QUEUE SHEET ════════════════════════════════ */
#queue-sheet {
  position: fixed; inset: 0; z-index: 300; display: none; flex-direction: column; justify-content: flex-end;
}
#queue-sheet.open { display: flex; }
.qs-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.6); }
.qs-drawer {
  position: relative; background: var(--surf);
  border-radius: 20px 20px 0 0;
  border-top: 1px solid var(--border);
  max-height: 72dvh; display: flex; flex-direction: column;
}
.qs-handle { display: flex; justify-content: center; padding: 12px 0 0; }
.qs-handle::after { content:''; width:36px; height:4px; background:var(--border); border-radius:2px; display:block; }
.qs-head {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 20px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.qs-head h3 { font-size: 15px; font-weight: 600; }
.qs-clear { background:none; border:none; color:var(--muted); font-size:12px; font-family:inherit; cursor:pointer; }
#queue-list { overflow-y: auto; -webkit-overflow-scrolling: touch; flex:1; padding: 6px 0 calc(var(--safe-b) + 8px); }
.qi {
  display: flex; align-items: center; gap: 12px;
  padding: 9px 16px; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.qi:active { background: var(--card); }
.qi.now { background: rgba(162,89,255,.1); }
.qi img { width:42px; height:42px; border-radius:7px; object-fit:cover; flex-shrink:0; }
.qi-info { overflow:hidden; flex:1; }
.qi-t { font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.qi-a { font-size:11px; color:var(--muted); }
.qi.now .qi-t { color: var(--accent2); }
.qi-rm { background:none; border:none; color:var(--muted); font-size:18px; padding:4px; cursor:pointer; flex-shrink:0; }

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>

<!-- Top bar -->
<div id="topbar">
  <div style="display:flex;align-items:center;justify-content:space-between;">
    <div class="logo">◎ <em>WAVE</em></div>
  </div>
  <div class="search-row">
    <input id="q" type="text" placeholder="Buscar músicas, álbuns, playlists…"
           onkeydown="if(event.key==='Enter')doSearch()"/>
    <button onclick="doSearch()">Buscar</button>
  </div>
  <div class="tabs">
    <button class="tab active" data-type="track"    onclick="setTab(this)">Músicas</button>
    <button class="tab"        data-type="album"    onclick="setTab(this)">Álbuns</button>
    <button class="tab"        data-type="playlist" onclick="setTab(this)">Playlists</button>
    <button class="tab"        data-type="artist"   onclick="setTab(this)">Artistas</button>
  </div>
</div>

<!-- Content -->
<div id="main">
  <div class="section-title" id="sec-title">Charts Globais</div>
  <div id="results"><div class="spinner"></div></div>
</div>

<!-- Mini player -->
<div id="mini-player" onclick="openPlayer()">
  <img id="mini-cover" src="" alt=""/>
  <div class="mini-text">
    <div id="mini-title">—</div>
    <div id="mini-artist"></div>
  </div>
  <div class="mini-btns">
    <button class="mini-btn" onclick="event.stopPropagation();prevTrack()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
    </button>
    <button class="mini-btn mini-play-btn" id="mini-play-btn" onclick="event.stopPropagation();togglePlay()">
      <svg id="mp-play" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      <svg id="mp-pause" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
    </button>
    <button class="mini-btn" onclick="event.stopPropagation();nextTrack()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
    </button>
  </div>
  <div class="mini-prog"><div class="mini-prog-fill" id="mini-fill"></div></div>
</div>

<!-- Bottom nav -->
<div id="bottom-nav">
  <button class="nav-btn active" id="nav-home" onclick="navHome()">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    <span>Início</span>
  </button>
  <button class="nav-btn" id="nav-search" onclick="navSearch()">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <span>Buscar</span>
  </button>
  <button class="nav-btn" id="nav-queue" onclick="openQueue()">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
    <span>Fila</span>
  </button>
</div>

<!-- Full player sheet -->
<div id="player-sheet">
  <div class="ps-header">
    <button class="ps-close" onclick="closePlayer()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <span class="ps-label">Tocando agora</span>
    <div style="width:36px;"></div>
  </div>

  <div class="ps-cover-wrap">
    <img id="ps-cover" src="" alt=""/>
  </div>

  <div class="ps-info">
    <div class="ps-text">
      <div id="ps-title">—</div>
      <div id="ps-artist">Nenhuma música</div>
    </div>
  </div>

  <div class="ps-progress">
    <div class="ps-bar-wrap">
      <div id="ps-fill"></div>
      <input type="range" id="ps-seek" min="0" max="100" value="0" oninput="seekTo(this.value)"/>
    </div>
    <div class="ps-times">
      <span id="ps-cur">0:00</span>
      <span id="ps-dur">0:00</span>
    </div>
  </div>

  <div class="ps-controls">
    <button class="pc-btn" id="btn-shuffle" onclick="toggleShuffle()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/></svg>
    </button>
    <button class="pc-btn" onclick="prevTrack()">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
    </button>
    <button class="pc-play" id="pc-play-btn" onclick="togglePlay()">
      <svg id="ps-icon-play" width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      <svg id="ps-icon-pause" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
    </button>
    <button class="pc-btn" onclick="nextTrack()">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
    </button>
    <button class="pc-btn" id="btn-repeat" onclick="toggleRepeat()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
    </button>
  </div>

  <div class="ps-queue-row">
    <button class="pq-btn" onclick="closePlayer();openQueue()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      <span>FILA</span>
    </button>
  </div>
</div>

<!-- Queue sheet -->
<div id="queue-sheet">
  <div class="qs-backdrop" onclick="closeQueue()"></div>
  <div class="qs-drawer">
    <div class="qs-handle"></div>
    <div class="qs-head">
      <h3>Fila de reprodução</h3>
      <button class="qs-clear" onclick="clearQueue()">Limpar</button>
    </div>
    <div id="queue-list"></div>
  </div>
</div>

<audio id="audio" preload="auto"></audio>

<script>
const audio = document.getElementById('audio');
let queue = [], qIdx = -1, searchType = 'track';
let shuffle = false, repeatMode = 'none';
let tracksCache = [];

const fmt = s => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const $id = id => document.getElementById(id);

// ── Tabs / Search ──────────────────────────────────
function setTab(btn) {
  searchType = btn.dataset.type;
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const q = $id('q').value.trim();
  if (q) doSearch(); else showChart();
}

function doSearch() {
  const q = $id('q').value.trim();
  if (!q) return;
  const labels = {track:'Músicas', album:'Álbuns', playlist:'Playlists', artist:'Artistas'};
  setTitle(labels[searchType] || 'Resultados');
  spin();
  api(`/api/search?q=${encodeURIComponent(q)}&type=${searchType}`)
    .then(d => {
      if (searchType === 'track') renderTracks(d.data || []);
      else renderCards(d.data || [], searchType);
    }).catch(() => err('Erro na busca.'));
}

// ── Charts ─────────────────────────────────────────
function showChart() {
  setTitle('Charts Globais');
  spin();
  api('/api/chart').then(d => renderTracks(d.data || [])).catch(() => err('Erro.'));
}

// ── Renderers ──────────────────────────────────────
function renderTracks(tracks) {
  tracksCache = tracks;
  const el = $id('results');
  if (!tracks.length) { el.innerHTML = '<div class="empty">Nenhum resultado.</div>'; return; }
  const ul = document.createElement('div');
  ul.className = 'track-list';
  tracks.forEach((t, i) => {
    const cover = t.album?.cover_small || t.cover_small || '';
    const d = document.createElement('div');
    d.className = 'track-item' + (queue[qIdx]?.id === t.id ? ' playing' : '');
    d.innerHTML = `
      <img class="track-cover" src="${cover}" loading="lazy" alt=""/>
      <div class="track-info">
        <div class="track-title">${esc(t.title)}</div>
        <div class="track-artist">${esc(t.artist?.name||'')}</div>
      </div>
      <div class="track-dur">${fmt(t.duration||0)}</div>`;
    d.addEventListener('click', () => playFromList(tracks, i));
    ul.appendChild(d);
  });
  el.innerHTML = '';
  el.appendChild(ul);
}

function renderCards(items, type) {
  const el = $id('results');
  if (!items.length) { el.innerHTML = '<div class="empty">Nenhum resultado.</div>'; return; }
  const g = document.createElement('div');
  g.className = 'card-grid';
  items.forEach(item => {
    const cover = item.cover_medium || item.picture_medium || item.cover || '';
    const sub = item.artist?.name || (item.nb_tracks ? `${item.nb_tracks} faixas` : '');
    const c = document.createElement('div');
    c.className = 'card';
    c.innerHTML = `
      <img class="card-cover" src="${cover}" loading="lazy" alt=""/>
      <div class="card-body">
        <div class="card-title">${esc(item.title||item.name||'')}</div>
        <div class="card-sub">${esc(sub)}</div>
      </div>`;
    c.addEventListener('click', () => openCollection(type, item.id, item.title||item.name||''));
    g.appendChild(c);
  });
  el.innerHTML = '';
  el.appendChild(g);
}

async function openCollection(type, id, name) {
  setTitle(name); spin();
  // Muda tab para músicas para mostrar lista
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.type === 'track'));
  searchType = 'track';
  try {
    const endpoint = type === 'artist' ? `/api/artist/${id}/top` : `/api/${type}/${id}`;
    const data = await api(endpoint);
    const tracks = data.tracks?.data || data.data || [];
    renderTracks(tracks);
  } catch(e) { err('Erro ao carregar.'); }
}

// ── Playback ───────────────────────────────────────
function tObj(t) {
  return {
    id: t.id,
    title: t.title || '—',
    artist: t.artist?.name || '',
    cover: t.album?.cover_small || t.cover_small || '',
    coverL: t.album?.cover_big || t.album?.cover_medium || t.cover_big || t.cover_medium || '',
    duration: t.duration || 0
  };
}

function playFromList(tracks, i) {
  queue = tracks.map(tObj);
  qIdx = i;
  playAt(qIdx);
  renderQueue();
}

function playAt(i) {
  if (i < 0 || i >= queue.length) return;
  qIdx = i;
  const t = queue[i];
  audio.src = `/api/stream/${t.id}`;
  audio.play().catch(()=>{});
  updateUI(t);
  highlightList();
  highlightQueue();
}

function updateUI(t) {
  // mini
  $id('mini-cover').src = t.coverL || t.cover;
  $id('mini-title').textContent = t.title;
  $id('mini-artist').textContent = t.artist;
  $id('mini-player').classList.add('visible');
  // full
  $id('ps-cover').src = t.coverL || t.cover;
  $id('ps-title').textContent = t.title;
  $id('ps-artist').textContent = t.artist;
  // icons — playing state
  setPlayIcons(true);
  document.title = `${t.title} — WAVE`;
}

function setPlayIcons(playing) {
  const show = (el, v) => el.style.display = v ? '' : 'none';
  show($id('mp-play'), !playing);   show($id('mp-pause'), playing);
  show($id('ps-icon-play'), !playing); show($id('ps-icon-pause'), playing);
}

function togglePlay() {
  if (!audio.src || audio.src === location.href) return;
  audio.paused ? audio.play().catch(()=>{}) : audio.pause();
}

audio.addEventListener('play',  () => setPlayIcons(true));
audio.addEventListener('pause', () => setPlayIcons(false));
audio.addEventListener('ended', () => nextTrack());

function nextTrack() {
  if (!queue.length) return;
  if (repeatMode === 'one') { audio.currentTime = 0; audio.play(); return; }
  let next = shuffle
    ? Math.floor(Math.random() * queue.length)
    : (qIdx + 1) % queue.length;
  if (next === 0 && repeatMode === 'none' && qIdx === queue.length - 1) return;
  qIdx = next; playAt(qIdx);
}

function prevTrack() {
  if (!queue.length) return;
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  qIdx = (qIdx - 1 + queue.length) % queue.length;
  playAt(qIdx);
}

function toggleShuffle() {
  shuffle = !shuffle;
  $id('btn-shuffle').classList.toggle('active', shuffle);
}

function toggleRepeat() {
  const m = ['none','all','one'];
  repeatMode = m[(m.indexOf(repeatMode)+1)%3];
  $id('btn-repeat').classList.toggle('active', repeatMode !== 'none');
  $id('btn-repeat').title = repeatMode === 'one' ? 'Repetir 1' : repeatMode === 'all' ? 'Repetir tudo' : 'Repetir';
}

// ── Progress ───────────────────────────────────────
audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  const pct = (audio.currentTime / audio.duration) * 100;
  $id('mini-fill').style.width = pct + '%';
  $id('ps-fill').style.width = pct + '%';
  $id('ps-seek').value = pct;
  $id('ps-cur').textContent = fmt(audio.currentTime);
  $id('ps-dur').textContent = fmt(audio.duration);
});

function seekTo(v) {
  if (audio.duration) audio.currentTime = (v/100) * audio.duration;
}

// ── Player sheet ───────────────────────────────────
function openPlayer()  { $id('player-sheet').classList.add('open'); }
function closePlayer() { $id('player-sheet').classList.remove('open'); }

// ── Queue ──────────────────────────────────────────
function openQueue()  { $id('queue-sheet').classList.add('open'); }
function closeQueue() { $id('queue-sheet').classList.remove('open'); }

function clearQueue() {
  queue = []; qIdx = -1;
  audio.pause(); audio.src = '';
  $id('mini-player').classList.remove('visible');
  setPlayIcons(false);
  renderQueue();
  highlightList();
}

function renderQueue() {
  const el = $id('queue-list');
  if (!queue.length) { el.innerHTML = '<div class="empty" style="padding:24px">Fila vazia.</div>'; return; }
  el.innerHTML = '';
  queue.forEach((t,i) => {
    const d = document.createElement('div');
    d.className = 'qi' + (i === qIdx ? ' now' : '');
    d.innerHTML = `
      <img src="${t.cover||''}" alt=""/>
      <div class="qi-info">
        <div class="qi-t">${esc(t.title)}</div>
        <div class="qi-a">${esc(t.artist)}</div>
      </div>
      <button class="qi-rm" onclick="rmQueue(event,${i})">✕</button>`;
    d.addEventListener('click', e => { if (e.target.classList.contains('qi-rm')) return; qIdx=i; playAt(i); });
    el.appendChild(d);
  });
}

function rmQueue(e, i) {
  e.stopPropagation();
  queue.splice(i, 1);
  if (i < qIdx) qIdx--;
  else if (i === qIdx) { if (queue.length) playAt(qIdx % queue.length); else clearQueue(); }
  renderQueue(); highlightList();
}

function highlightQueue() {
  document.querySelectorAll('.qi').forEach((el,i) => el.classList.toggle('now', i===qIdx));
}

function highlightList() {
  const cur = queue[qIdx];
  document.querySelectorAll('.track-item').forEach((el,i) =>
    el.classList.toggle('playing', cur && tracksCache[i]?.id === cur.id));
}

// ── Nav ────────────────────────────────────────────
function navHome() {
  $id('q').value = '';
  showChart();
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  $id('nav-home').classList.add('active');
}
function navSearch() {
  $id('q').focus();
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  $id('nav-search').classList.add('active');
}

// ── Util ───────────────────────────────────────────
async function api(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
function setTitle(t) { $id('sec-title').textContent = t; }
function spin() { $id('results').innerHTML = '<div class="spinner"></div>'; }
function err(m) { $id('results').innerHTML = `<div class="empty">${m}</div>`; }

// ── Init ───────────────────────────────────────────
showChart();
</script>
</body>
</html>
